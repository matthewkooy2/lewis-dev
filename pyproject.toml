[project]
name = "lewis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "openai>=1.0.0,<3",
    "pypdf>=4.0.0,<7",
    "uvicorn>=0.30.0,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.0.0,<10",
    "ruff==0.15.16",
]

[tool.uv]
required-version = "==0.12.11"
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Default skip list plus the ignored local runtime directory: benchmark runs
# may keep disposable fixture repositories (with their own tests/) under
# runtime/, and those must never be collected by an ordinary repo-root pytest.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "runtime",
    "{arch}",
]
filterwarnings = [
    # Import-time warning from the installed fastapi -> starlette.testclient
    # pairing with the legacy httpx client. Resolving it upstream requires
    # installing the httpx2 package (a dependency change), not a Lewis code
    # change. The filter is pinned to the exact upstream message and category
    # so any new or unrelated deprecation still surfaces.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["runtime"]
